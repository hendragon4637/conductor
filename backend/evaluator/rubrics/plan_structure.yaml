name: plan_structure
applies_to: ["planner", "plan"]
items:
  - id: covers_goal
    rubric_item: "Do the nodes together fully cover the plan goal (nothing missing)?"
    weight: 2.0
  - id: right_sized
    rubric_item: "Is each node a bounded, single-responsibility unit (not too big/small)?"
    weight: 1.5
  - id: deps_correct
    rubric_item: "Are dependencies correct and minimal (no missing or spurious edges)?"
    weight: 1.5
  - id: measurable
    rubric_item: "Does each node have a measurable success criterion?"
    weight: 1.0
  - id: checks_scoped
    rubric_item: "Is each node's checks scoped to its task (no irrelevant checks on unrelated nodes)?"
    weight: 1.0
  - id: staffing_capable
    rubric_item: "Is each node staffed by an agent_config actually capable of its task (no strategic-operational mismatch)?"
    weight: 2.0
  - id: checks_match_capabilities
    rubric_item: "Do the generated checks cover the node's capability quality dimensions (objective->L1, subjective->L2)?"
    weight: 1.5
