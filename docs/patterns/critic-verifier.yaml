# Critic-Verifier — producer drafts; critic reviews; loop until approved.

agent_config_id: example:ui-designer
harness: example
domain: ui-design
role: designer
pattern: critic-verifier

routing_rules:
  pattern_hint: critic-verifier
  max_iterations: 3
  on_success:
    - next_config: example:ui-critic
      pass: output_spec

