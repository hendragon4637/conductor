[project]
name = "conductor"
version = "0.1.0"
description = "Conductor — AI PC orchestration control plane"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "croniter>=6.2.2",
    "fastapi>=0.136.1",
    "gitpython>=3.1.50",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "jsonschema>=4.26.0",
    "langchain-core>=1.4.0",
    "langfuse>=2.0",
    "langgraph>=1.2.0",
    "mcp[cli]>=1.27.2",
    "pika>=1.3.2",
    "playwright>=1.60.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.47.0",
    "watchfiles>=1.2.0",
]

# contracts/ and shared/ are importable sub-packages (no separate pyproject.toml needed)
[tool.setuptools.packages.find]
include = ["contracts*", "shared*", "services*"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
markers = [
    "slow: Integration tests that require long-running LLM calls or AionUi waits (deselect with '-m \"not slow\"')",
]
