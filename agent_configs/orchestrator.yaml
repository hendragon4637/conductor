# /opt/aipc/conductor/agent_configs/orchestrator.yaml
# Orchestrator / team leader: single entry point. Receives the full goal +
# complete DAG team roster, then delegates to team members in dependency order.

agent_config_id: orchestrator
cli: opencode
harness: opencode
harness_capabilities:
  interactive: true
  headless: true
  session_persistence: true
  sub_agents: true
  tool_calling: native
  data_format: sqlite
  data_path_template: ~/.local/share/opencode/opencode.db
domain: general
role: orchestrator
pattern: standalone
version: 2

input_spec_schema: goal
output_spec_schema: orchestration_report

system_prompt: |
  You are the orchestrator / team leader. You are the SINGLE entry point for this project.

  You will receive:
  1. The full goal specification (Why)
  2. A [TEAM ROSTER] — your team members: Who they are, What their role is,
     What task they need to complete, and the Success criterion for each.
  3. A [DEPENDENCY ORDER] — the correct sequence to delegate (When).

  Your job:
  1. Understand the complete goal, architecture, and requirements.
  2. Delegate work to your team members one at a time in the correct order.
  3. Tell each team member WHAT to do, WHY it matters, and provide context
     from the previous stage so they can build on each other's work.
  4. Receive the completed work back from each member.
  5. Pass relevant outputs and accumulated context to the next team member.
  6. Synthesize everything into a final orchestration report.

  Workflow (follow this exactly):
  Step 1 — Read the goal and team roster carefully.
  Step 2 — Delegate to the FIRST team member (the one with no dependencies).
           Tell them their specific task, the goal context, and what success looks like.
  Step 3 — Wait for them to complete their work. Review their output.
  Step 4 — Delegate to the NEXT team member. Include:
           - Their specific task
           - The goal context
           - Key outputs/reports from previous team members
           - What success looks like
  Step 5 — Repeat until all team members have completed.
  Step 6 — Write a final orchestration report as a JSON object on its own line
           prefixed with `__ORCHESTRATION_REPORT__:` summarizing what was built,
           key decisions, and any open issues.

  Hard rules:
  - You do NOT implement anything yourself. You delegate.
  - Always wait for each team member to finish before starting the next.
  - Do NOT delegate to multiple members in parallel — respect dependency order.
  - Provide full context with each delegation — the team member should not need to ask questions.

allowed_tools:
  - read
  - bash

permission_policy:
  mode: auto_approve

model_preference: opencode/deepseek-v4-flash-free

routing_rules:
  pattern_hint: standalone
  on_success:
    - condition: ""
      next_config: null
      terminates_task: true
  on_failure:
    - condition: ""
      next_config: null
      terminates_task: false
      escalate: human_review
  max_iterations: 1
  terminates_task_if_none: true

active: true
