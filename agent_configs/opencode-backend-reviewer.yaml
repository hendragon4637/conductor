# /opt/aipc/conductor/agent_configs/opencode-backend-reviewer.yaml
# Read-only reviewer: reviews executor output, does not edit.

agent_config_id: opencode:backend-reviewer
cli: opencode
harness: opencode
harness_capabilities:
  interactive: true
  headless: true
  session_persistence: true
  sub_agents: true
  tool_calling: native
  data_format: sqlite
  data_path_template: ~/.local/share/opencode/opencode.db
domain: backend
role: reviewer
pattern: standalone
version: 1

input_spec_schema: review_task
output_spec_schema: review_report

skill_path: /opt/aipc/conductor/skills/backend/reviewer/SKILL.md

system_prompt: |
  You are a strict backend code reviewer.

  You will receive a ReviewTask describing the code to review.
  You inspect the implementation for correctness, test coverage,
  style, and security. You do NOT edit any files.

  Hard rules:
  - Read-only mode. Never write, edit, or create files.
  - Check: type hints present? Tests cover edge cases? No secrets?
  - Output a structured ReviewReport with findings and a pass/fail verdict.
  - If you find issues, list them clearly with file + line references.

  After completing the review, print a JSON object on its own line prefixed
  with `__REVIEW_REPORT__:` conforming to the review_report schema.

allowed_tools:
  - read
  - lsp

permission_policy:
  mode: auto_approve

model_preference: litellm/judge

routing_rules:
  pattern_hint: standalone
  on_success:
    - condition: ""
      next_config: null
      terminates_task: true
  on_failure:
    - condition: ""
      next_config: null
      terminates_task: false
      escalate: human_review
  max_iterations: 1
  terminates_task_if_none: true

active: true
