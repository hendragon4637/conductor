# /opt/aipc/conductor/agent_configs/finance-fullstack-executor.yaml
# Full-stack executor: builds FastAPI backend + vanilla HTML/JS UI + pytest.

agent_config_id: finance-fullstack-executor
cli: opencode
harness: opencode
harness_capabilities:
  interactive: true
  headless: true
  session_persistence: true
  sub_agents: true
  tool_calling: native
  data_format: sqlite
  data_path_template: ~/.local/share/opencode/opencode.db
domain: finance
role: executor
pattern: standalone
version: 1

input_spec_schema: reformulated_task
output_spec_schema: contribution_receipt

system_prompt: |
  You build simple full-stack CRUD apps: FastAPI backend + minimal vanilla HTML/JS.
  Integer cents for money. Write pytest for the API. Keep it minimal and runnable.
  Work autonomously.

  You will receive a ReformulatedTask describing what to build.
  Implement it directly. You do NOT plan or verify — those are separate roles.

  Hard rules:
  - Use type hints on every new public function.
  - Tests are required for new endpoints (pytest + httpx).
  - Use httpx, not requests.
  - asyncio for I/O.
  - Integer cents for monetary values.
  - Keep the UI as a single minimal HTML/JS page.
  - Output a ContributionReceipt JSON object summarizing what you did.

  After completing the work, print a JSON object on its own line prefixed
  with `__CONTRIBUTION_RECEIPT__:` that conforms to the contribution_receipt
  schema.

allowed_tools:
  - read
  - write
  - bash
  - lsp

permission_policy:
  mode: auto_approve

model_preference: litellm/gptoss-exec

routing_rules:
  pattern_hint: standalone
  on_success:
    - condition: ""
      next_config: null
      terminates_task: true
  on_failure:
    - condition: ""
      next_config: null
      terminates_task: false
      escalate: human_review
  max_iterations: 1
  terminates_task_if_none: true

active: true

default_checks:
  l1:
    - id: tests_pass
      kind: shell
      cmd: python3 -m pytest -q --tb=short 2>&1
      expect: {exit_code: 0}
      on_fail:
        what: "Tests failed"
        how: "Read the failing assertion in the pytest output and fix the implementation"
        evidence_from: stdout
    - id: python_syntax
      kind: shell
      cmd: files=$(find . -name '*.py' -not -path './.git/*' -not -path './.venv/*'); if [ -z "$files" ]; then echo 'No Python files found'; exit 1; fi; python3 -m py_compile $files 2>&1
      expect: {exit_code: 0}
      on_fail:
        what: "Python syntax errors detected"
        how: "Fix the syntax errors reported by python3 -m py_compile in the checked files"
        evidence_from: stdout
  l2:
    - id: integer_cents
      rubric_item: "Money stored as integer cents (no float)?"
      weight: 1.5
    - id: validation
      rubric_item: "Inputs validated (reject negative/empty)?"
      weight: 1.0
    - id: tests_pass_l2
      rubric_item: "All existing tests still pass after changes?"
      weight: 1.0
    - id: types_used
      rubric_item: "Type hints on all new public functions?"
      weight: 1.0
