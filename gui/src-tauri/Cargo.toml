[package]
name = "aipc-conductor-gui"
version = "0.1.0"
description = "AIPC Conductor — Tauri desktop shell with embedded PTY terminals"
authors = ["aipc"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aipc_conductor_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-pty = "0.1"
