[project]
name = "project-name"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=8.0", "ruff>=0.3.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
